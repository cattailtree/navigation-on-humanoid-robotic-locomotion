  <path d="M940 320 C990 320, 1012 246, 1044 246" class="arrow"/>
  <path d="M1374 220 H1400" class="arrow"/>
  <text x="1385" y="205" class="small">候选目标</text>

  <path d="M1515 275 V470" class="arrow"/>
  <text x="1530" y="350" class="small">否</text>
  <path d="M1630 190 H1718 V790 H1748" class="arrow"/>
  <text x="1648" y="178" class="small">是</text>
  <path d="M1280 622 H1370" class="arrowThin"/>
  <text x="1305" y="602" class="small">是</text>
  <path d="M1280 650 C1325 650, 1328 672, 1370 672" class="arrowThin"/>
  <text x="1305" y="680" class="small">否</text>
  <path d="M1480 608 V752 C1480 772, 1118 772, 1118 790" class="arrow"/>
  <path d="M1480 706 V752 C1480 772, 1118 772, 1118 790" class="arrow"/>

  <path d="M1055 902 V946 H770 V902" class="arrow"/>
  <path d="M880 846 H930" class="arrow"/>
  <path d="M1180 846 H1224" class="arrow"/>
  <path d="M1474 846 H1518" class="arrow"/>
  <path d="M1633 902 V958 H183 V832" class="feedback"/>
  <path d="M183 760 V660" class="feedback"/>
  <path d="M1349 790 C1349 748, 1344 748, 1344 720" class="feedback"/>

  <!-- Bottom labels -->
  <rect x="390" y="934" width="1040" height="64" fill="#f4f7fb" stroke="#c8d3e0" stroke-width="2" rx="12"/>
  <text x="910" y="960" text-anchor="middle" class="small">闭环反馈：机器人位姿、碰撞/风险、目标检测置信度、局部执行误差持续更新语义图与下一轮规划</text>
  <text x="910" y="986" text-anchor="middle" class="tiny muted">当前实现：Qwen task parser + semantic graph/A* + LabRobotAdapter/FDM-MPPI；后续接入真实 RGB-D 语义分割与在线图更新</text>
</svg>
