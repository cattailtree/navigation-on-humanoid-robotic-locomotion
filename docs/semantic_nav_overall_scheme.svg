<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1040" viewBox="0 0 1800 1040">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#174b9a"/>
    </marker>
    <marker id="arrowGray" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 12 6 L 0 12 z" fill="#60646c"/>
    </marker>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eff9e7"/>
      <stop offset="1" stop-color="#b7dcaa"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#edf7ff"/>
      <stop offset="1" stop-color="#b9d8f5"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff8dc"/>
      <stop offset="1" stop-color="#f2d88e"/>
    </linearGradient>
    <linearGradient id="gray" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f6f6"/>
      <stop offset="1" stop-color="#c8c8c8"/>
    </linearGradient>
    <style>
      .title { font: 700 34px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #111; }
      .subtitle { font: 700 24px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #174b9a; }
      .label { font: 700 22px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #111; }
      .small { font: 17px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #20242a; }
      .tiny { font: 15px "Microsoft YaHei", "Noto Sans CJK SC", Arial, sans-serif; fill: #20242a; }
      .white { fill: #fff; }
      .muted { fill: #5a6070; }
      .box { stroke: #111; stroke-width: 3; rx: 12; ry: 12; }
      .thin { stroke: #111; stroke-width: 2; }
      .dash { stroke-dasharray: 13 9; }
      .arrow { stroke: #174b9a; stroke-width: 4; fill: none; marker-end: url(#arrow); }
      .arrowThin { stroke: #174b9a; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .feedback { stroke: #60646c; stroke-width: 3; fill: none; marker-end: url(#arrowGray); stroke-dasharray: 8 7; }
      .lane { fill: none; stroke: #70c8ef; stroke-width: 4; stroke-dasharray: 16 10; rx: 20; ry: 20; }
      .panel { fill: #fff; stroke: #111; stroke-width: 4; }
      .diamond { fill: url(#green); stroke: #09244a; stroke-width: 4; }
    </style>
  </defs>

  <rect x="0" y="0" width="1800" height="1040" fill="#ffffff"/>
  <text x="900" y="52" text-anchor="middle" class="title">基于 Qwen 语义理解、A* 探索与 FDM-MPPI 的人形机器人长程导航方案</text>

  <!-- Input column -->
  <rect x="48" y="120" width="270" height="170" fill="url(#gray)" class="box"/>
  <text x="183" y="168" text-anchor="middle" class="label">自然语言任务</text>
  <text x="183" y="205" text-anchor="middle" class="small">“坐电梯去地下室目标房间”</text>
  <text x="183" y="238" text-anchor="middle" class="tiny muted">goal text / target object / floor hint</text>

  <rect x="48" y="360" width="270" height="300" fill="#fff" class="box"/>
  <rect x="72" y="390" width="222" height="124" fill="#dbe9f7" stroke="#111" stroke-width="2"/>
  <path d="M92 482 L128 434 L172 462 L210 416 L276 486" fill="none" stroke="#3f7fb5" stroke-width="5"/>
  <circle cx="130" cy="428" r="12" fill="#f3c74c"/>
  <rect x="72" y="530" width="222" height="48" fill="#666" stroke="#111" stroke-width="2"/>
  <text x="183" y="562" text-anchor="middle" class="label white">RGB-D / Camera</text>
  <rect x="72" y="590" width="222" height="48" fill="#666" stroke="#111" stroke-width="2"/>
  <text x="183" y="622" text-anchor="middle" class="label white">机器人位姿</text>

  <rect x="48" y="760" width="270" height="72" fill="#777" class="box"/>
  <text x="183" y="806" text-anchor="middle" class="label white">环境 / Isaac Lab</text>

  <!-- LLM lane -->
  <rect x="378" y="96" width="610" height="300" class="panel"/>
  <text x="683" y="142" text-anchor="middle" class="subtitle">目标中心语义理解（本地免费 Qwen）</text>
  <rect x="402" y="170" width="560" height="198" class="lane"/>
  <rect x="426" y="190" width="236" height="72" fill="url(#green)" class="box"/>
  <text x="544" y="220" text-anchor="middle" class="label">Qwen 语义解析</text>
  <text x="544" y="247" text-anchor="middle" class="tiny">Ollama + qwen2.5:3b</text>
  <rect x="724" y="190" width="216" height="72" fill="url(#green)" class="box"/>
  <text x="832" y="220" text-anchor="middle" class="label">结构化任务</text>
  <text x="832" y="247" text-anchor="middle" class="tiny">intent / floor / node</text>
  <rect x="426" y="284" width="236" height="72" fill="url(#green)" class="box"/>
  <text x="544" y="314" text-anchor="middle" class="label">目标提示扩展</text>
  <text x="544" y="341" text-anchor="middle" class="tiny">目标物体 / 相似物 / 地点词</text>
  <rect x="724" y="284" width="216" height="72" fill="url(#green)" class="box"/>
  <text x="832" y="314" text-anchor="middle" class="label">语义标签融合</text>
  <text x="832" y="341" text-anchor="middle" class="tiny">图节点 + 检测置信度</text>

  <!-- Mapping panel -->
  <rect x="378" y="430" width="610" height="270" class="panel"/>
  <text x="683" y="470" text-anchor="middle" class="subtitle">感知与语义地图构建</text>
  <rect x="408" y="500" width="260" height="150" fill="#e9f5ff" stroke="#111" stroke-width="2"/>
  <path d="M430 610 L450 555 L490 575 L540 522 L620 615" fill="none" stroke="#9aa3aa" stroke-width="12" stroke-linecap="round"/>
  <path d="M430 610 L450 555 L490 575 L540 522 L620 615" fill="none" stroke="#53606a" stroke-width="5" stroke-linecap="round"/>
  <rect x="488" y="548" width="74" height="48" fill="#8e43e7" opacity="0.85"/>
  <circle cx="610" cy="582" r="12" fill="#83d84b"/>
  <circle cx="526" cy="616" r="6" fill="#174bff"/>
  <text x="538" y="681" text-anchor="middle" class="label">前沿 / 拓扑地图</text>

  <rect x="700" y="500" width="260" height="150" fill="#fff2d5" stroke="#111" stroke-width="2"/>
  <path d="M720 610 C780 570, 790 520, 838 535 C884 548, 875 612, 940 630" fill="none" stroke="#f09b72" stroke-width="32" stroke-linecap="round" opacity="0.75"/>
  <path d="M770 625 C810 600, 848 596, 908 560" fill="none" stroke="#e64d35" stroke-width="22" stroke-linecap="round" opacity="0.75"/>
  <circle cx="842" cy="590" r="7" fill="#174bff"/>
  <rect x="922" y="518" width="15" height="92" fill="url(#yellow)" stroke="#111" stroke-width="1"/>
  <text x="930" y="503" text-anchor="middle" class="tiny">高</text>
  <text x="930" y="633" text-anchor="middle" class="tiny">低</text>
  <text x="830" y="681" text-anchor="middle" class="label">语义得分 / 代价图</text>

  <!-- Semantic graph -->
  <rect x="1044" y="96" width="330" height="300" class="panel"/>
  <text x="1209" y="142" text-anchor="middle" class="subtitle">目标中心语义图</text>
  <circle cx="1140" cy="224" r="28" fill="#cdecc3" stroke="#111" stroke-width="3"/>
  <circle cx="1240" cy="224" r="28" fill="#cdecc3" stroke="#111" stroke-width="3"/>
  <circle cx="1190" cy="315" r="28" fill="#cdecc3" stroke="#111" stroke-width="3"/>
  <line x1="1168" y1="224" x2="1212" y2="224" stroke="#174b9a" stroke-width="4"/>
  <line x1="1155" y1="247" x2="1177" y2="292" stroke="#174b9a" stroke-width="4"/>
  <line x1="1226" y1="247" x2="1204" y2="292" stroke="#174b9a" stroke-width="4"/>
  <text x="1140" y="230" text-anchor="middle" class="tiny">F1</text>
  <text x="1240" y="230" text-anchor="middle" class="tiny">电梯</text>
  <text x="1190" y="321" text-anchor="middle" class="tiny">B1房间</text>
  <text x="1209" y="362" text-anchor="middle" class="small">节点：走廊 / 电梯 / 房间 / 前沿</text>

  <!-- Decisions and exploration -->
  <polygon points="1515,105 1630,190 1515,275 1400,190" class="diamond"/>
  <text x="1515" y="176" text-anchor="middle" class="label">目标是否</text>
  <text x="1515" y="207" text-anchor="middle" class="label">可靠？</text>

  <rect x="1044" y="470" width="600" height="250" class="panel"/>
  <text x="1344" y="512" text-anchor="middle" class="subtitle">自适应探索策略</text>
  <polygon points="1170,552 1280,622 1170,692 1060,622" fill="url(#blue)" stroke="#09244a" stroke-width="4"/>
  <text x="1170" y="610" text-anchor="middle" class="label">语义线索</text>
  <text x="1170" y="641" text-anchor="middle" class="label">是否明显？</text>
  <rect x="1370" y="540" width="220" height="68" fill="url(#blue)" class="box"/>
  <text x="1480" y="570" text-anchor="middle" class="label">基于语义探索</text>
  <text x="1480" y="596" text-anchor="middle" class="tiny">朝高得分区域 / 目标提示移动</text>
  <rect x="1370" y="638" width="220" height="68" fill="url(#blue)" class="box"/>
  <text x="1480" y="668" text-anchor="middle" class="label">基于几何探索</text>
  <text x="1480" y="694" text-anchor="middle" class="tiny">frontier / 覆盖 / 避障边界</text>

  <!-- Planning and control -->
  <rect x="930" y="790" width="250" height="112" fill="url(#yellow)" class="box"/>
  <text x="1055" y="828" text-anchor="middle" class="label">A* 全局规划</text>
  <text x="1055" y="858" text-anchor="middle" class="small">语义图路径 / 楼层切换</text>
  <text x="1055" y="884" text-anchor="middle" class="tiny">start -> corridor -> elevator -> target</text>

  <rect x="1224" y="790" width="250" height="112" fill="url(#yellow)" class="box"/>
  <text x="1349" y="828" text-anchor="middle" class="label">FDM-MPPI 局部规划</text>
  <text x="1349" y="858" text-anchor="middle" class="small">采样轨迹 / FDM 打分 / 风险代价</text>
  <text x="1349" y="884" text-anchor="middle" class="tiny">输出 NavSE2Action / 局部速度</text>

  <rect x="1518" y="790" width="230" height="112" fill="url(#gray)" class="box"/>
  <text x="1633" y="828" text-anchor="middle" class="label">底层步态执行</text>
  <text x="1633" y="858" text-anchor="middle" class="small">G1 gait policy / PD</text>
  <text x="1633" y="884" text-anchor="middle" class="tiny">关节动作 -> 机器人位姿</text>

  <rect x="660" y="790" width="220" height="112" fill="url(#green)" class="box"/>
  <text x="770" y="828" text-anchor="middle" class="label">安全航点导航</text>
  <text x="770" y="858" text-anchor="middle" class="small">航点队列 / yaw 对齐</text>
  <text x="770" y="884" text-anchor="middle" class="tiny">电梯 handoff / final approach</text>

  <!-- Arrows -->
  <path d="M318 205 H426" class="arrow"/>
  <path d="M662 226 H724" class="arrowThin"/>
  <path d="M832 262 V284" class="arrowThin"/>
  <path d="M544 262 V284" class="arrowThin"/>
